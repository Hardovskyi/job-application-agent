name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: python -m pytest tests/ -q --cov=app --cov-report=term-missing

  eval-harness:
    runs-on: ubuntu-latest
    # Only burns API credits when the repo secret is configured.
    if: ${{ github.event_name == 'push' && secrets.OPENAI_API_KEY != '' }}
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run gold evaluation suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: openai
          MAX_REVISIONS: "2"
        run: python -m evals.run_eval --suite gold --out evals/results/ci_gold.json

      - name: Upload eval summary
        uses: actions/upload-artifact@v4
        with:
          name: eval-summary
          path: evals/results/ci_gold.json
